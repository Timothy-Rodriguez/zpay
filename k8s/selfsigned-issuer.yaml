# Let's Encrypt ClusterIssuer — issues trusted TLS certs via HTTP-01 challenge.
# Requires port 80 open on the server: sudo ufw allow 80/tcp
#
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mtimothyrodriguez2000@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: traefik

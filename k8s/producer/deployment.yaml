apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-producer
  namespace: prod
  labels:
    app: prod-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-producer
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: prod-producer
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 3; done']
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: producer
          image: registry.gitlab.com/YOUR_NAMESPACE/zpay/producer:latest
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-secrets
                  key: DB_PASSWORD
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger:4317"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: prod-config

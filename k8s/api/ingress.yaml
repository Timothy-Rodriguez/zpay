# Traefik Ingress with IP-based HTTPS
# cert-manager automatically generates self-signed certificates
# (installed via GitLab CI/CD)
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-api
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: selfsigned
spec:
  tls:
    - secretName: prod-api-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-api
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-api
  namespace: prod
  labels:
    app: prod-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prod-api
  progressDeadlineSeconds: 120   # k8s marks rollout Failed if not done in 2 min
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # zero-downtime: always keep all replicas running during update
      maxSurge: 1
  template:
    metadata:
      labels:
        app: prod-api
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      # Wait for Postgres and Redis before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: api
          # Image tag is updated by CI: kubectl set image deployment/prod-api api=<new>
          image: registry.gitlab.com/YOUR_NAMESPACE/zpay/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-secrets
                  key: DB_PASSWORD
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-secrets
                  key: SMTP_PASSWORD
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger:4317"
            # Set your Vercel frontend URL here so CORS allows it
            - name: CORS_ALLOWED_ORIGINS
              value: "https://zpay-app-chi.vercel.app"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
            - name: jwt-secret
              mountPath: /app/secret
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: prod-config
        - name: jwt-secret
          secret:
            secretName: prod-secrets
            items:
              - key: jwt-secret.txt
                path: jwt-secret.txt

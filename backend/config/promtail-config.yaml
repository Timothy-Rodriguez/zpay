server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: zpay-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: zpay
          service: zpay-backend
          env: local
          __path__: /var/log/zpay/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            msg: msg
      - labels:
          level:
      - timestamp:
          source: ts
          format: RFC3339Nano
